<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101c3a">
<title>Koşucu Kahraman</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c3a;font-family:system-ui,-apple-system,sans-serif;touch-action:none;color:#fff}.game{height:100dvh;width:min(100vw,520px);margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);gap:8px;background:linear-gradient(#182d59,#101c3a)}header{display:flex;align-items:center;justify-content:space-between;padding:5px 3px}.brand{font-size:18px;font-weight:1000;letter-spacing:.5px}.brand span{color:#ffcf4a}.pill{background:#ffffff16;border:1px solid #ffffff22;padding:7px 11px;border-radius:30px;font-weight:900;font-size:12px}.arena{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden;border:2px solid #ffffff28;background:#7bd7f4;box-shadow:0 7px 0 #09132c}.arena canvas{width:100%;height:100%;display:block}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}.hudbox{background:#10264acb;border:1px solid #ffffff38;border-radius:13px;padding:7px 10px;font-size:12px;font-weight:900;text-shadow:0 1px #0004}.centerOverlay{position:absolute;inset:0;background:#08132c9c;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}.dialog{width:100%;max-width:310px;border-radius:24px;padding:23px 18px;background:linear-gradient(145deg,#254a85,#18254d);border:1px solid #ffffff4d;box-shadow:0 12px 0 #101934}.heroemoji{font-size:62px;filter:drop-shadow(0 7px 0 #10193455)}h1{font-size:27px;margin:6px 0 3px;font-weight:1000}p{color:#d4e4ff;font-size:13px;line-height:1.45;margin:6px 0 17px}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:14px 12px;font-weight:1000;font-size:16px;color:#4a2a00;background:linear-gradient(#ffe77a,#ffb92e);box-shadow:0 5px 0 #b76b18;touch-action:manipulation}.secondary{margin-top:10px;background:#ffffff18;color:#fff;box-shadow:none;border:1px solid #ffffff35;font-size:13px;padding:11px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.control{height:60px;border-radius:18px;border:1px solid #ffffff2d;background:linear-gradient(#304c7b,#1b2c51);box-shadow:0 5px 0 #0a142b;color:#fff;font-size:15px;font-weight:1000;touch-action:manipulation}.control:active{transform:translateY(3px);box-shadow:0 2px 0 #0a142b}.control span{font-size:22px;vertical-align:middle;margin-right:6px}.tip{text-align:center;color:#a9c3ef;font-size:10px;padding:1px 0 6px}.hidden{display:none!important}
</style>
</head>
<body><main class="game">
<header><div class="brand">🏃 KOŞUCU <span>KAHRAMAN</span></div><div class="pill" id="best">🏆 REKOR 0</div></header>
<section class="arena" id="arena"><canvas id="c"></canvas><div class="hud"><div class="hudbox">🪙 <span id="coins">0</span></div><div class="hudbox">📏 <span id="distance">0</span> m</div></div>
<div class="centerOverlay" id="overlay"><div class="dialog"><div class="heroemoji" id="heroemoji">🦊</div><h1 id="title">Koşmaya hazır mısın?</h1><p id="message">Altınları topla, engellerin üzerinden atla! Ne kadar uzağa gidebilirsin?</p><button class="primary" id="start">OYUNA BAŞLA ▶</button><button class="secondary" id="how">NASIL OYNANIR?</button></div></div>
</section>
<div class="controls"><button class="control" id="jump"><span>⬆️</span> ZIPLA</button><button class="control" id="slide"><span>⬇️</span> EĞİL / KAÇ</button></div>
<div class="tip">Ekrana dokunarak veya ZIPLA düğmesiyle zıpla · Altınları kap!</div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('c'),ctx=canvas.getContext('2d');let W=360,H=600,dpr=1,raf=0,last=0,mode='menu',player,obstacles=[],coins=[],particles=[],distance=0,collected=0,speed=260,spawn=0,coinSpawn=0,best=Number(localStorage.getItem('kosucu-best')||0),world=0,duckTime=0;
$('best').textContent='🏆 REKOR '+best;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);if(player){player.x=W*.24;player.ground=H*.79;if(player.y>player.ground)player.y=player.ground}}addEventListener('resize',resize);
function reset(){distance=0;collected=0;speed=260;spawn=.6;coinSpawn=.3;world=0;obstacles=[];coins=[];particles=[];duckTime=0;player={x:W*.24,y:H*.79,ground:H*.79,vy:0,duck:0,run:0};$('coins').textContent='0';$('distance').textContent='0'}
function start(){resize();reset();mode='play';$('overlay').classList.add('hidden');last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function end(){mode='over';if(collected>best){best=collected;localStorage.setItem('kosucu-best',best)}$('best').textContent='🏆 REKOR '+best;$('overlay').classList.remove('hidden');$('heroemoji').textContent='😵';$('title').textContent='Yolculuk bitti!';$('message').textContent=''+Math.floor(distance)+' metre koştun ve '+collected+' altın topladın. Bir tur daha dene!';$('start').textContent='TEKRAR OYNA ↻';$('how').classList.add('hidden')}
function jump(){if(mode!=='play')return;if(player.y>=player.ground-1){player.vy=-Math.max(470,H*.95);player.duck=0;burst(player.x+20,player.y,'#fff0a6',7)}}
function duck(){if(mode==='play'){player.duck=.55}}
$('start').addEventListener('click',start);$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('slide').addEventListener('pointerdown',e=>{e.preventDefault();duck()});canvas.addEventListener('pointerdown',e=>{if(mode==='play')jump()});$('how').onclick=()=>{$('title').textContent='Nasıl oynanır?';$('message').textContent='ZIPLA düğmesine bas veya oyun alanına dokun. Kutuların üzerinden atla, altınları topla ve kırmızı engellerden kaç. EĞİL düğmesi alçak engellerden kaçmana yardım eder.';$('heroemoji').textContent='🎮';$('how').classList.add('hidden')};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(mode==='play')jump();else start()}if(e.code==='ArrowDown')duck()});
function burst(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.8)*170,t:.5,color})}
function rect(x,y,w,h,color,r=0){ctx.fillStyle=color;if(r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}else ctx.fillRect(x,y,w,h)}
function drawBg(dt){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#65d7f5');sky.addColorStop(.68,'#d0f4ff');sky.addColorStop(1,'#f7d99b');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff5b8';ctx.beginPath();ctx.arc(W*.78,H*.17,Math.min(W,H)*.075,0,Math.PI*2);ctx.fill();
for(let layer=0;layer<2;layer++){let base=H*(.58+layer*.09),par=(world*(layer?.12:.22))%(W*.7);ctx.fillStyle=layer?'#64c7a0':'#8ed8bf';ctx.beginPath();ctx.moveTo(0,H);for(let x=-W;x<W*2;x+=W*.22){let xx=x-par;ctx.lineTo(xx,base-Math.sin((x/W)*2.7+layer)*H*.055)}ctx.lineTo(W*2,H);ctx.closePath();ctx.fill()}
rect(0,H*.79,W,H*.21,'#d7a85e');rect(0,H*.79,W,8,'#5ed29c');let tile=(world*.9)%48;for(let x=-tile;x<W;x+=48){rect(x,H*.82,29,4,'#b8894b',2);rect(x+13,H*.89,21,3,'#b8894b',2)}}
function drawPlayer(dt){let p=player;p.run+=dt*12;let ducking=p.duck>0;let bob=p.y>=p.ground-1?Math.sin(p.run)*3:0;ctx.save();ctx.translate(p.x,p.y+(ducking?12:0)+bob);ctx.scale(ducking?1.2:1,ducking?.68:1);
ctx.fillStyle='#142c4c35';ctx.beginPath();ctx.ellipse(10,5,24,6,0,0,Math.PI*2);ctx.fill();
// tail
ctx.fillStyle='#e76e35';ctx.beginPath();ctx.moveTo(-5,-28);ctx.quadraticCurveTo(-32,-42,-25,-18);ctx.quadraticCurveTo(-15,-10,-4,-18);ctx.fill();
// legs animated
let leg=Math.sin(p.run)*8;rect(-8,-13,10,17,'#354d9a',4);rect(5+leg*.35,-13,10,17,'#354d9a',4);rect(-11+leg*.35,0,16,6,'#f5f7ff',3);rect(3-leg*.35,0,16,6,'#f5f7ff',3);
// body and arms
rect(-13,-43,29,31,'#ffb62f',10);rect(-18,-38,9,21,'#e76e35',5);rect(11,-39,9,20,'#e76e35',5);
// head
ctx.fillStyle='#f28b43';ctx.beginPath();ctx.arc(2,-54,18,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f28b43';ctx.beginPath();ctx.moveTo(-12,-65);ctx.lineTo(-12,-83);ctx.lineTo(0,-69);ctx.fill();ctx.beginPath();ctx.moveTo(5,-68);ctx.lineTo(16,-82);ctx.lineTo(17,-60);ctx.fill();
ctx.fillStyle='#ffe6b8';ctx.beginPath();ctx.ellipse(5,-49,11,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#18324d';ctx.beginPath();ctx.arc(8,-56,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-57,1,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawObstacle(o){if(o.type==='crate'){rect(o.x,o.y,o.w,o.h,'#d56b36',8);rect(o.x+5,o.y+5,o.w-10,7,'#ffbb66',3);rect(o.x+o.w*.45,o.y+4,5,o.h-8,'#9c462f',2);ctx.strokeStyle='#9c462f';ctx.lineWidth=3;ctx.strokeRect(o.x+5,o.y+5,o.w-10,o.h-10)}else{ctx.fillStyle='#ed4f65';ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w*.5,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();rect(o.x,o.y+o.h-7,o.w,7,'#bd334d',3)}}
function loop(now){if(mode!=='play')return;let dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw(dt);raf=requestAnimationFrame(loop)}
function update(dt){world+=speed*dt;distance+=speed*dt/18;speed=Math.min(470,260+distance*.8);player.ground=H*.79;player.x=W*.24;player.duck=Math.max(0,player.duck-dt);player.vy+=H*2.7*dt;player.y+=player.vy*dt;if(player.y>player.ground){player.y=player.ground;player.vy=0}
spawn-=dt;if(spawn<=0){let type=Math.random()<.55?'crate':'spike';let h=type==='crate'?38+Math.random()*13:31;obstacles.push({x:W+30,y:H*.79-h,w:type==='crate'?39:34,h,type});spawn=Math.max(.72,1.38-distance/900)+Math.random()*.48}
coinSpawn-=dt;if(coinSpawn<=0){let count=4+Math.floor(Math.random()*3),startX=W+20,cy=H*(.48+Math.random()*.15);for(let i=0;i<count;i++)coins.push({x:startX+i*31,y:cy-Math.sin(i/(count-1)*Math.PI)*20,r:10,got:false});coinSpawn=1.5+Math.random()*1.2}
const px=player.x-10,py=player.y-(player.duck>0?28:57),pw=player.duck>0?42:35,ph=player.duck>0?24:56;
for(let o of obstacles){o.x-=speed*dt;if(px+pw-7>o.x&&px+7<o.x+o.w&&py+ph-5>o.y+5&&py+5<o.y+o.h){end();return}}
for(let c of coins){c.x-=speed*dt;if(!c.got&&Math.hypot(c.x-(player.x+3),c.y-(player.y-36))<31){c.got=true;collected++;$('coins').textContent=collected;burst(c.x,c.y,'#ffcf4a',5)}}
obstacles=obstacles.filter(o=>o.x>-70);coins=coins.filter(c=>c.x>-30&&!c.got);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);$('distance').textContent=Math.floor(distance)}
function draw(dt){drawBg(dt);for(let c of coins){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(world/120+c.x)*.2);ctx.fillStyle='#e69a19';ctx.beginPath();ctx.ellipse(0,0,c.r,c.r*1.12,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff09a';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff3ad';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);ctx.restore()}for(let o of obstacles)drawObstacle(o);drawPlayer(dt);for(let p of particles){ctx.globalAlpha=Math.max(0,p.t*2);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}}
resize();reset();draw(0);
})();
</script></body></html>
