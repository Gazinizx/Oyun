name: Godot Native Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Android export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Configure Android SDK, Java and signing
        shell: bash
        run: |
          set -euxo pipefail
          javac -version
          JDK_PATH="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JDK_PATH" >> "$GITHUB_ENV"
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}"
          test -d "$SDK_PATH"
          SDKMANAGER=""
          for candidate in "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" "$SDK_PATH/cmdline-tools/cmdline-tools/bin/sdkmanager" "$SDK_PATH/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ] && command -v sdkmanager >/dev/null 2>&1; then SDKMANAGER="$(command -v sdkmanager)"; fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_PATH"
            find "$SDK_PATH" -maxdepth 5 -name sdkmanager -type f -print
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK_PATH" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_PATH" "platform-tools" "platforms;android-33" "platforms;android-35" "build-tools;33.0.2" "build-tools;35.0.0" "ndk;23.2.8568313"
          test -s "$SDK_PATH/platforms/android-33/android.jar"
          test -s "$SDK_PATH/platforms/android-35/android.jar"
          test -x "$SDK_PATH/build-tools/33.0.2/aapt"
          test -x "$SDK_PATH/build-tools/35.0.0/aapt"
          test -d "$SDK_PATH/ndk/23.2.8568313"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_PATH"
          export/android/java_sdk_path = "$JDK_PATH"
          export/android/ndk_path = "$SDK_PATH/ndk/23.2.8568313"
          EOF
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          awk -v key="$HOME/debug.keystore" '/^\[preset.0.options\]$/ { print; print "keystore/debug=\"" key "\""; print "keystore/debug_user=\"androiddebugkey\""; print "keystore/debug_password=\"android\""; next } { print }' export_presets.cfg > /tmp/export_presets.cfg
          mv /tmp/export_presets.cfg export_presets.cfg
          echo "Configured Android SDK: $SDK_PATH"
          "$SDKMANAGER" --sdk_root="$SDK_PATH" --list_installed
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Export and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/AltinAvi.apk 2>&1 | tee /tmp/godot-export.log
          test -s build/AltinAvi.apk
          file build/AltinAvi.apk
          unzip -t build/AltinAvi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Altin-Avi-Native-Android-APK
          path: build/AltinAvi.apk
          if-no-files-found: error
          retention-days: 14
