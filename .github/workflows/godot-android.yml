name: Godot Native Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/AltinAvi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Altin-Avi-Native-Android-APK
          path: build/AltinAvi.apk
          if-no-files-found: error
          retention-days: 14
